<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telugu DOC to PDF Converter</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 450px; width: 100%; }
        h2 { color: #333; margin-bottom: 5px; }
        p.sub { color: #888; font-size: 14px; margin-bottom: 20px; }
        .flash-error { color: #d9534f; background: #fdf7f7; border: 1px solid #d9534f; padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; }
        .file-box { border: 2px dashed #008080; padding: 30px; border-radius: 8px; cursor: pointer; background: #f0fdfd; margin-bottom: 20px; position: relative; }
        .file-box input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .btn { background: #26a69a; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:hover { background: #00897b; }
    </style>
</head>
<body>

<div class="card">
    <h2>తెలుగు DOC → PDF Converter</h2>
    <p class="sub">100% Font Preserved Output (No Box Errors)</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash-error">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- MUST HAVE enctype="multipart/form-data" -->
    <form action="/" method="POST" enctype="multipart/form-data">
        <div class="file-box">
            📁 Click to select your Telugu Word File (.doc / .docx)
            <!-- MUST HAVE name="file" -->
            <input type="file" name="file" accept=".doc,.docx" required onchange="showFileName(this)">
            <p id="selected-name" style="margin-top: 10px; font-weight: bold; color: #333;"></p>
        </div>
        <button type="submit" class="btn">Convert to PDF</button>
    </form>
</div>

<script>
    function showFileName(input) {
        if (input.files && input.files[0]) {
            document.getElementById('selected-name').innerText = "Selected: " + input.files[0].name;
        }
    }
</script>

</body>
</html>
